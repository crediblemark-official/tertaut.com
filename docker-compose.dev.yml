services:
  # Database lokal untuk development & pre-push hook test
  # Jalankan: docker compose -f docker-compose.dev.yml up -d
  db:
    image: postgres:16-alpine
    container_name: tertaut_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: tertautuser
      POSTGRES_PASSWORD: doaayyjfjvbd1ml1
      POSTGRES_DB: tertautname
    ports:
      - "5432:5432"
    volumes:
      - tertaut_db_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tertautuser -d tertautname"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tertaut_db_dev_data:
