services:
  app:
    image: ghcr.io/crediblemark-official/tertaut.com:latest
    pull_policy: always
    container_name: tertaut_app
    restart: always
    expose:
      - "8081"
    networks:
      - default
      - dokploy-network
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8081}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://tertaut.com}
      DATABASE_URL: ${DATABASE_URL:-}

      JWT_SECRET: ${JWT_SECRET:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      HWID_SALT: ${HWID_SALT:-}
      STRICT_SECRETS: ${STRICT_SECRETS:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-platformtertaut@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

      LICENSE_SIGNING_PRIVATE_KEY_BASE64: ${LICENSE_SIGNING_PRIVATE_KEY_BASE64:-}
      LICENSE_SIGNING_PRIVATE_KEY: ${LICENSE_SIGNING_PRIVATE_KEY:-}

      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}

      ACTIVE_PAYMENT_GATEWAY: ${ACTIVE_PAYMENT_GATEWAY:-${PAYMENT_GATEWAY:-xendit}}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-xendit}

      XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
      XENDIT_WEBHOOK_VERIFICATION_TOKEN: ${XENDIT_WEBHOOK_VERIFICATION_TOKEN:-}
      XENDIT_WEBHOOK_TOKEN: ${XENDIT_WEBHOOK_TOKEN:-}

      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  dokploy-network:
    external: true
