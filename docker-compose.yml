services:
  postgres:
    image: postgres:16-alpine
    container_name: tertaut_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-tertaut}
      # Optimasi memori PostgreSQL untuk VPS kecil (512MB-1GB RAM)
      shared_buffers: 128MB
      effective_cache_size: 384MB
      work_mem: 64kB
      maintenance_work_mem: 64MB
      # WAL & checkpoint
      max_wal_size: 256MB
      min_wal_size: 64MB
      checkpoint_completion_target: 0.9
      # Connection
      max_connections: 30
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-tertaut}"]
      interval: 15s
      timeout: 5s
      retries: 3
    # Prioritas rendah agar proses lain tidak terkikis
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M
          cpus: "0.1"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tertaut_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-tertaut}}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-}
      VAULT_ENCRYPTION_KEY: ${VAULT_ENCRYPTION_KEY:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      LICENSE_SIGNING_PRIVATE_KEY: ${LICENSE_SIGNING_PRIVATE_KEY:-}
      HWID_SALT: ${HWID_SALT:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-dana}
      DANA_ENV: ${DANA_ENV:-production}
      DANA_ORIGIN: ${DANA_ORIGIN:-}
      DANA_CLIENT_ID: ${DANA_CLIENT_ID:-}
      DANA_CLIENT_SECRET: ${DANA_CLIENT_SECRET:-}
      DANA_MERCHANT_ID: ${DANA_MERCHANT_ID:-}
      DANA_BASE_URL: ${DANA_BASE_URL:-https://api.saas.dana.id}
      DANA_PUBLIC_KEY: ${DANA_PUBLIC_KEY:-}
      DANA_PRIVATE_KEY: ${DANA_PRIVATE_KEY:-}
      DANA_SANDBOX_CLIENT_ID: ${DANA_SANDBOX_CLIENT_ID:-}
      DANA_SANDBOX_CLIENT_SECRET: ${DANA_SANDBOX_CLIENT_SECRET:-}
      DANA_SANDBOX_MERCHANT_ID: ${DANA_SANDBOX_MERCHANT_ID:-}
      DANA_SANDBOX_BASE_URL: ${DANA_SANDBOX_BASE_URL:-https://api.sandbox.dana.id}
      DANA_SANDBOX_PUBLIC_KEY: ${DANA_SANDBOX_PUBLIC_KEY:-}
      DANA_SANDBOX_PRIVATE_KEY: ${DANA_SANDBOX_PRIVATE_KEY:-}
      # Bun runtime optimasi
      BUN_LOG_SCOPE: "*"
      BUN_JSX_RUNTIME: "haste"
    ports:
      - "${APP_PORT:-3001}:3000"
    # Prioritas rendah untuk proses Bun
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${PORT:-3000}/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:

